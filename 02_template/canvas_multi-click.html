					</div>
<pre><code class="html">
</code></pre>

	</div>
	<script>
		const canvas = document.getElementById('glcanvas');
		const ctx = canvas.getContext('2d');

		const gravity = 0.5;
		const bounce = 0.7;
		const ground = canvas.height - 20;
		const balls = [];

		// 마우스 클릭 이벤트로 새로운 공 추가
		canvas.addEventListener('mousedown', function(e) {
			balls.push({
				x: Math.random() * (canvas.width - 40) + 20, // x위치 무작위
				y: 0,
				vy: 0,
				color: ['red', 'green', 'blue', 'orange'][Math.floor(Math.random() * 4)]
			});
		});

		function animate() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			balls.forEach(ball => {
				ball.vy += gravity;
				ball.y  += ball.vy;

				if(ball.y > ground) {
				ball.y = ground;
				ball.vy = -ball.vy * bounce;
				if(Math.abs(ball.vy) < 1) ball.vy = 0;
				}

				ctx.beginPath();
				ctx.arc(ball.x, ball.y, 20, 0, 2 * Math.PI);
				ctx.fillStyle = ball.color;
				ctx.fill();
			});

			requestAnimationFrame(animate);
		}

		animate();
	</script>

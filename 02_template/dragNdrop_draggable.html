	<title>기본 가이드</title>
	<!-- 가이드 관련 -->
	<link rel="stylesheet" href="../guide/list-guide.css" media="screen, print" />
	<link rel="stylesheet" href="../guide/vendor/railscasts.css">
	<script src="../guide/vendor/highlight.js"></script>

	<!-- 프로젝트 관련 CSS 및 JS 파일 로드 -->
	<link rel="stylesheet" href="../css/layout.css" media="screen, print" />

	<style type="text/css">
		.drag-list { width:300px; }
		.drag-list li { display:block; width:100%; padding:5px; border:1px solid #aaa; box-sizing:border-box; }
		.drag-list li + li { margin-top:5px; }
		.drag-list li.over { background-color:#eee; }
		.drag-list li.ghost { opacity:.4; }
		.drag-list li .list-title { display:block; pointer-events:none; }
	</style>
</head>
<body class="pub-guide">
	<div id="work-list">
		<div class="guide">
			

			<!-- input ================================================================ -->
			<section id="guide-input">
				<h2 class="guide-sec-tit">Drag &amp; Drop (html5)</h2>

				<div class="guide-sec">
					<h3 class="guide-stit">순서 변경</h3>
					<div class="guide-show">
						<ul class="drag-list">
							<li draggable="true" data-num="1">
								<span class="list-title">드래그 아이템 1번 입니다.</span>
								<a href="#">바로가기</a>
							</li>
							<li draggable="true" data-num="2">
								<span class="list-title">드래그 아이템 2번 입니다.</span>
								<a href="#">바로가기</a>
							</li>
							<li draggable="true" data-num="3">
								<span class="list-title">드래그 아이템 3번 입니다.</span>
								<a href="#">바로가기</a>
							</li>
							<li draggable="true" data-num="4">
								<span class="list-title">드래그 아이템 4번 입니다.</span>
								<a href="#">바로가기</a>
							</li>
							<li draggable="true" data-num="5">
								<span class="list-title">드래그 아이템 5번 입니다.</span>
								<a href="#">바로가기</a>
							</li>
						</ul>
					</div>
				</div>
			</section>


		</div>
		<a href="#work-list" class="guide-top">Top</a>	
	</div>

	<script src="../js/common.js"></script>
	<script>
		hljs.initHighlightingOnLoad(); 
		
		let item_area = document.querySelector('.drag-list'),
			items = item_area.querySelectorAll('li'),
			drag_item;
		items.forEach((item)=>{
			item.addEventListener('dragstart', (e)=>{
				drag_item = item;
			});
			item.addEventListener('dragenter', (e)=>{
				e.target.style.opacity = .5;
			});
			item.addEventListener('dragleave', (e)=>{
				e.target.style.opacity = 1;
			});
			item.addEventListener('dragover', (e)=>{ // drop 이벤트 발생을 위해 dragover 이벤트 방지
				e.preventDefault();
			});
			item.addEventListener('drop', (e)=>{
				if(e.target == drag_item) return;
				seq_set(e.target, drag_item);
				drag_item = null;
				items.forEach((item)=>{ item.style.opacity = 1; })
			});
		});

		function seq_set(target, item){
			let tg_box = target.getBoundingClientRect(),
				item_box = item.getBoundingClientRect();
			tg_box.top > item_box.top ? target.after(item) : target.before(item);
		}
	</script>
</body>
</html>

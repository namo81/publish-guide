	<!-- 프로젝트 관련 CSS 및 JS 파일 로드 -->
	<link rel="stylesheet" href="/css/layout.css" media="screen, print" />

	<style>
		.editor-wrap .edit-cnt { min-height:300px; padding:15px; font-size:14px; border:1px solid #eee; color:#333; }
		.editor-wrap u { text-decoration:underline; }
		.editor-wrap i { font-style:italic; }
		.editor-wrap ul, .editor-wrap ol { display:block; width:auto; padding-inline-start:40px; }
		.editor-wrap ul li { list-style:disc; }
		.editor-wrap ol li { list-style:auto; }
		.editor-wrap .srch-input { display:inline-block; padding:0 3px; }

		.modal-srch { position:absolute; padding:5px 10px; border:1px solid #999; background-color:#eee; box-sizing:border-box;}
		.modal-srch .srch-list button.active { background-color:#ddd; }

		.editor-wrap .sel-member { vertical-align:top; color:#096dd7; }
		
		.auto-wrap { position:relative; }
		.auto-wrap input { width:100%; padding:5px; font-size:14px; line-height:20px; border:1px solid #ddd; box-sizing:border-box; }
		.auto-wrap .hidden_tag { position:absolute; left:-9999px; opacity:0; }

		.modal-srch ul, .modal-srch ol { padding-inline-start:0; }
		.modal-srch ul li, .modal-srch ol li { list-style:none; }
	</style>
</head>
<body>
	<div id="work-list">
		<div class="guide">

			<section id="guide-basic">
				<h2 class="guide-sec-tit">자동완성</h2>

					<p>(단, 각 라인의 첫글자가 @ 이거나, 공백 뒤에 @ 입력 시 실행)</p>
					<div class="guide-show">
					<!-- 코드 작성 -->
						<div class="editor-wrap">
							<div class="edit-cnt" contenteditable="true">
								<div><br></div>
							</div>

					</div>
<pre><code class="html">

<pre><code class="html">

			data     : 데이터 (json 및 배열형식)
		*/

		let autoMail = new nAutoCompMail({

<pre><code class="html">

	<script>
		const canvas = document.getElementById("glcanvas"),
			ctx = canvas.getContext("2d");
		
		let items = [],
			interval_item;

		function make_items(){
			items.push({
				x : Math.floor(Math.random() * canvas.width),
				y : 0,
				gravity : (Math.random() * 2) + 1,
				size : (Math.random() * 5) + 1,
				x_gap : (Math.random() * 100) * (Math.random() * 1.5) - 1,
				x_speed : Math.random() * 0.02,
				vy : 0,
				color : getRandomRgbColor()
			});
		}

		function motion(){
			ctx.clearRect(0,0,canvas.width, canvas.height);
			ctx.fillStyle = '0x333333';
			ctx.fillRect(0,0,canvas.width, canvas.height);
			items.forEach((item)=>{
				item.y += item.gravity;
				let posX  = item.x + Math.cos(item.y * item.x_speed) * item.x_gap * (1 - item.y / canvas.height);

				if(item.y > canvas.height){
					item.y = canvas.height;
				}
				ctx.save();
				ctx.beginPath();
				ctx.arc(posX, item.y, item.size, 0, 2 * Math.PI);
				ctx.fillStyle = item.color;
				ctx.fill();
				ctx.restore();
			});
			requestAnimationFrame(motion);
		}
		motion();

		interval_item = setInterval(make_items, 100);

		function getRandomRgbColor(size) {
			let r = Math.floor(Math.random() * 256),
				g = Math.floor(Math.random() * 256),
				b = Math.floor(Math.random() * 256),
				a = Math.random() * 1;
			return `rgba(255, 255, 255, ${a})`;
		}

		function arr_del(arr, tx){
			let findIndex = arr.indexOf(tx);
			if(findIndex > -1) { arr.splice(findIndex, 1); }
		}

	</script>
